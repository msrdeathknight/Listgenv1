name: 📱 Build Android APK — Resync Scheduler

on:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write
  actions: read

jobs:
  build-apk:
    name: 📱 Build APK — ${{ github.event.inputs.build_type || 'release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ──────────────────────────────────────────
      # 1. Checkout (empty repo is fine)
      # ──────────────────────────────────────────
      - name: 📥 Checkout
        uses: actions/checkout@v4

      # ──────────────────────────────────────────
      # 2. Generate entire Android project in-repo
      # ──────────────────────────────────────────
      - name: 🏗️ Generate Android project
        run: |
          set -eu
          BASE="$GITHUB_WORKSPACE"
          mkdir -p "$BASE"/app/src/main/java/com/resync/scheduler
          mkdir -p "$BASE"/app/src/main/res/layout
          mkdir -p "$BASE"/app/src/main/res/values
          mkdir -p "$BASE"/app/src/main/res/drawable
          mkdir -p "$BASE"/app/src/main/assets
          mkdir -p "$BASE"/gradle/wrapper

          # ── settings.gradle ──
          cat > "$BASE"/settings.gradle << 'GRADLEEOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ResyncScheduler"
          include ':app'
          GRADLEEOF

          # ── build.gradle (root) ──
          cat > "$BASE"/build.gradle << 'GRADLEEOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.0'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          GRADLEEOF

          # ── gradle.properties ──
          cat > "$BASE"/gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          org.gradle.caching=true
          EOF

          # ── gradle-wrapper.properties ──
          cat > "$BASE"/gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          # ── gradlew ──
          cat > "$BASE"/gradlew << 'EOF'
          #!/bin/sh
          PRG="$0"
          while [ -h "$PRG" ] ; do
              ls=`ls -ld "$PRG"`
              link=`expr "$ls" : '.*-> \(.*\)$'`
              if expr "$link" : '/.*' > /dev/null; then
                  PRG="$link"
              else
                  PRG=`dirname "$PRG"`"/$link"
              fi
          done
          SAVED="`pwd`"
          cd "`dirname \"$PRG\"`/" >/dev/null
          APP_HOME="`pwd -P`"
          cd "$SAVED" >/dev/null
          CLASSPATH=$APP_HOME/gradle/wrapper/gradle-wrapper.jar
          JAVACMD=java
          if [ -n "$JAVA_HOME" ] ; then
              JAVACMD="$JAVA_HOME/bin/java"
          fi
          exec "$JAVACMD" -Xmx64m -Xms64m -classpath "$CLASSPATH" org.gradle.wrapper.GradleWrapperMain "$@"
          EOF
          chmod +x "$BASE"/gradlew

          # ── app/build.gradle ──
          cat > "$BASE"/app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.resync.scheduler'
              compileSdk 34
              defaultConfig {
                  applicationId "com.resync.scheduler"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
              }
              buildTypes {
                  release {
                      minifyEnabled true
                      shrinkResources true
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
                  debug {
                      applicationIdSuffix ".debug"
                      debuggable true
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          # ── app/proguard-rules.pro ──
          cat > "$BASE"/app/proguard-rules.pro << 'EOF'
          -keepclassmembers class com.resync.scheduler.MainActivity$WebAppInterface {
              @android.webkit.JavascriptInterface <methods>;
          }
          -keep class com.resync.scheduler.MainActivity { *; }
          EOF

          # ── AndroidManifest.xml ──
          cat > "$BASE"/app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">
              <uses-permission android:name="android.permission.INTERNET" tools:node="remove"/>
              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:hardwareAccelerated="true"
                  android:theme="@style/Theme.ResyncScheduler">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden|uiMode"
                      android:windowSoftInputMode="adjustResize"
                      android:launchMode="singleTask"
                      android:theme="@style/Theme.ResyncScheduler">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # ── res/values/strings.xml ──
          cat > "$BASE"/app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">لیست ساز هوشمند</string>
          </resources>
          EOF

          # ── res/values/colors.xml ──
          cat > "$BASE"/app/src/main/res/values/colors.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="md_surface">#FFFBFBFB</color>
              <color name="md_surface_container">#FFF0F0F0</color>
              <color name="md_on_surface">#FF1A1A1A</color>
              <color name="md_primary">#FF1A1A1A</color>
              <color name="md_secondary_container">#FFE0E0E0</color>
              <color name="md_outline_variant">#FFD0D0D0</color>
              <color name="splash_bg">#FFFBFBFB</color>
          </resources>
          EOF

          # ── res/values/themes.xml ──
          cat > "$BASE"/app/src/main/res/values/themes.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.ResyncScheduler" parent="android:Theme.Material.Light.NoActionBar">
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">@android:color/transparent</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:windowBackground">@color/md_surface</item>
              </style>
          </resources>
          EOF

          # ── res/layout/activity_main.xml ──
          cat > "$BASE"/app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:fitsSystemWindows="true">
              <WebView
                  android:id="@+id/webview"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"/>
          </FrameLayout>
          EOF

          # ── MainActivity.java ──
          cat > "$BASE"/app/src/main/java/com/resync/scheduler/MainActivity.java << 'JAVAEOF'
          package com.resync.scheduler;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.content.res.Configuration;
          import android.graphics.Color;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          public class MainActivity extends Activity {

              private WebView webView;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      getWindow().setStatusBarColor(Color.TRANSPARENT);
                      getWindow().setNavigationBarColor(Color.TRANSPARENT);
                  }
                  setContentView(R.layout.activity_main);
                  webView = findViewById(R.id.webview);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setCacheMode(WebSettings.LOAD_NO_CACHE);
                  s.setUseWideViewPort(true);
                  s.setLoadWithOverviewMode(true);
                  s.setSupportZoom(false);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setTextZoom(100);

                  webView.setLayerType(View.LAYER_TYPE_HARDWARE, null);
                  webView.setBackgroundColor(Color.TRANSPARENT);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          int night = getResources().getConfiguration().uiMode
                              & Configuration.UI_MODE_NIGHT_MASK;
                          String theme = (night == Configuration.UI_MODE_NIGHT_YES) ? "dark" : "light";
                          view.evaluateJavascript(
                              "try{var s=localStorage.getItem('scheduleAppTheme');if(!s)document.documentElement.setAttribute('data-theme','"+theme+"')}catch(e){}",
                              null);
                      }
                  });
                  webView.setWebChromeClient(new WebChromeClient());
                  webView.addJavascriptInterface(new WebAppInterface(this), "Android");
                  webView.loadUrl("file:///android_asset/app.html");
              }

              @Override
              public void onConfigurationChanged(Configuration c) {
                  super.onConfigurationChanged(c);
                  if (webView != null) {
                      int night = c.uiMode & Configuration.UI_MODE_NIGHT_MASK;
                      String theme = (night == Configuration.UI_MODE_NIGHT_YES) ? "dark" : "light";
                      webView.evaluateJavascript(
                          "try{var s=localStorage.getItem('scheduleAppTheme');if(!s)document.documentElement.setAttribute('data-theme','"+theme+"')}catch(e){}",
                          null);
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }

              @Override protected void onResume() { super.onResume(); if (webView != null) webView.onResume(); }
              @Override protected void onPause() { if (webView != null) webView.onPause(); super.onPause(); }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.loadUrl("about:blank");
                      webView.clearHistory();
                      webView.removeAllViews();
                      webView.destroy();
                      webView = null;
                  }
                  super.onDestroy();
              }

              public static class WebAppInterface {
                  private final Activity a;
                  WebAppInterface(Activity a) { this.a = a; }
                  @JavascriptInterface
                  public void showToast(String msg) {
                      a.runOnUiThread(() -> Toast.makeText(a, msg, Toast.LENGTH_SHORT).show());
                  }
              }
          }
          JAVAEOF

          # ── app.html (complete offline web app with MD3E) ──
          # Writing in two parts to avoid heredoc issues
          python3 -c "
          import base64, sys
          html = open('/dev/stdin','r').read()
          with open('$BASE/app/src/main/assets/app.html','w',encoding='utf-8') as f:
              f.write(html)
          " << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="fa" dir="rtl">
          <head>
          <meta charset="UTF-8"/>
          <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=yes"/>
          <title>لیست ساز هوشمند | Resync</title>
          <style>
          :root{
          --md-surface:#fbfbfb;--md-surface-dim:#e8e8e8;--md-surface-bright:#fff;--md-surface-container:#f0f0f0;--md-surface-container-low:#f5f5f5;--md-surface-container-high:#e6e6e6;--md-surface-container-highest:#d9d9d9;
          --md-on-surface:#1a1a1a;--md-on-surface-variant:#4a4a4a;
          --md-primary:#1a1a1a;--md-on-primary:#fff;--md-primary-container:#e8e8e8;--md-on-primary-container:#1a1a1a;
          --md-secondary:#3d3d3d;--md-on-secondary:#fff;--md-secondary-container:#e0e0e0;--md-on-secondary-container:#1a1a1a;
          --md-tertiary:#5a5a5a;--md-on-tertiary:#fff;--md-tertiary-container:#d4d4d4;--md-on-tertiary-container:#1a1a1a;
          --md-outline:#b0b0b0;--md-outline-variant:#d0d0d0;--md-shadow:rgba(0,0,0,.08);
          --md-error:#ba1a1a;--md-on-error:#fff;--md-error-container:#ffdad6;--md-on-error-container:#410002;
          --md-font:'Iran Sans','Segoe UI',Tahoma,sans-serif;
          --md-radius-sm:8px;--md-radius-md:16px;--md-radius-lg:24px;--md-radius-xl:32px;--md-radius-pill:999px;
          --md-el1:0 1px 2px rgba(0,0,0,.05),0 1px 3px rgba(0,0,0,.06);
          --md-el2:0 3px 6px rgba(0,0,0,.06),0 2px 4px rgba(0,0,0,.04);
          --md-el3:0 6px 16px rgba(0,0,0,.08),0 4px 8px rgba(0,0,0,.04);
          --md-el4:0 12px 28px rgba(0,0,0,.1),0 6px 12px rgba(0,0,0,.04);
          --md-ease-spring:cubic-bezier(.2,0,0,1);--md-ease-standard:cubic-bezier(0,0,0,1);--md-ease-emphasized:cubic-bezier(.05,.7,.1,1);
          --md-dur-s4:200ms;--md-dur-m2:300ms;--md-dur-m4:400ms;--md-dur-l2:500ms;
          --gender-female:#6a6a6a;--gender-male:#3a3a3a;--gender-none:#9a9a9a;
          --modal-backdrop:rgba(0,0,0,.4);
          --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)
          }
          [data-theme="dark"]{
          --md-surface:#121212;--md-surface-dim:#0a0a0a;--md-surface-bright:#2a2a2a;--md-surface-container:#1e1e1e;--md-surface-container-low:#181818;--md-surface-container-high:#2a2a2a;--md-surface-container-highest:#363636;
          --md-on-surface:#e6e6e6;--md-on-surface-variant:#b0b0b0;
          --md-primary:#e6e6e6;--md-on-primary:#1a1a1a;--md-primary-container:#2d2d2d;--md-on-primary-container:#e6e6e6;
          --md-secondary:#b0b0b0;--md-on-secondary:#1a1a1a;--md-secondary-container:#3d3d3d;--md-on-secondary-container:#e6e6e6;
          --md-tertiary:#9a9a9a;--md-on-tertiary:#1a1a1a;--md-tertiary-container:#4a4a4a;--md-on-tertiary-container:#e6e6e6;
          --md-outline:#4a4a4a;--md-outline-variant:#363636;--md-shadow:rgba(0,0,0,.4);
          --md-error:#ff5449;--md-on-error:#1a1a1a;--md-error-container:#5a1a1a;--md-on-error-container:#ffdad6;
          --modal-backdrop:rgba(0,0,0,.7);
          --gender-female:#9a9a9a;--gender-male:#b0b0b0;--gender-none:#6a6a6a
          }
          *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
          html,body{height:100%;overflow:hidden;font-family:var(--md-font);background:var(--md-surface);color:var(--md-on-surface);transition:background var(--md-dur-m4) var(--md-ease-standard),color var(--md-dur-m4) var(--md-ease-standard);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
          .app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:520px;margin:0 auto;padding:var(--safe-top) 12px 0;gap:8px}
          .app-header{display:flex;align-items:center;justify-content:space-between;padding:8px 0 12px;border-bottom:1px solid var(--md-outline-variant);flex-shrink:0;transition:border-color var(--md-dur-m4) var(--md-ease-standard)}
          .app-header .brand{display:flex;align-items:center;gap:8px}
          .app-header h1{font-weight:900;font-size:1.4rem;letter-spacing:-.02em;background:linear-gradient(145deg,var(--md-primary),var(--md-secondary));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
          .app-header .badge{background:var(--md-surface-container);color:var(--md-on-surface-variant);padding:2px 14px;border-radius:var(--md-radius-pill);font-size:.75rem;font-weight:500;border:1px solid var(--md-outline-variant);white-space:nowrap}
          .header-actions{display:flex;align-items:center;gap:4px}
          .btn-icon{width:40px;height:40px;border:none;border-radius:50%;background:0 0;color:var(--md-on-surface-variant);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:22px;position:relative;overflow:hidden;outline:0;-webkit-tap-highlight-color:transparent;transition:background var(--md-dur-s4) var(--md-ease-standard),transform var(--md-dur-m2) var(--md-ease-emphasized)}
          .btn-icon:hover,.btn-icon:focus-visible{background:var(--md-surface-container)}
          .btn-icon:active{transform:scale(.88)}
          .btn-icon .ripple{position:absolute;border-radius:50%;background:var(--md-on-surface);opacity:.12;transform:scale(0);animation:rippleAnim 600ms var(--md-ease-standard) forwards;pointer-events:none}
          @keyframes rippleAnim{to{transform:scale(4);opacity:0}}
          .main-scroll{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-bottom:4px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
          .main-scroll::-webkit-scrollbar{width:3px}
