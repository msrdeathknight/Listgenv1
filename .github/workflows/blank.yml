          .main-scroll::-webkit-scrollbar-thumb{background:var(--md-outline);border-radius:8px}
          .card{background:var(--md-surface-container-low);border-radius:var(--md-radius-lg);padding:14px 16px;box-shadow:var(--md-el1);border:1px solid var(--md-outline-variant);flex-shrink:0;animation:cardEntrance var(--md-dur-l2) var(--md-ease-emphasized) both;transition:background var(--md-dur-m4) var(--md-ease-standard),box-shadow var(--md-dur-m4) var(--md-ease-standard),border-color var(--md-dur-m4) var(--md-ease-standard)}
          .card:hover{box-shadow:var(--md-el2)}
          @keyframes cardEntrance{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
          .card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-weight:500;font-size:.8rem;color:var(--md-on-surface-variant)}
          .card-header .title{display:flex;align-items:center;gap:6px}
          .input-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
          .md-field{flex:1;min-width:100px;position:relative}
          .md-field input,.md-field textarea,.md-field select{width:100%;padding:10px 12px;border:1.5px solid var(--md-outline);border-radius:var(--md-radius-md);background:var(--md-surface);color:var(--md-on-surface);font-family:var(--md-font);font-size:.9rem;transition:border-color .25s var(--md-ease-standard),box-shadow var(--md-dur-m2) var(--md-ease-standard),background var(--md-dur-m4) var(--md-ease-standard),transform var(--md-dur-s4) var(--md-ease-spring);outline:0;-webkit-appearance:none;appearance:none}
          .md-field input:focus,.md-field textarea:focus,.md-field select:focus{border-color:var(--md-primary);box-shadow:0 0 0 3px rgba(26,26,26,.1);transform:scale(1.005)}
          .md-field textarea{resize:none;min-height:44px;line-height:1.6}
          .md-field textarea:focus{min-height:80px}
          .btn{padding:10px 16px;border:none;border-radius:var(--md-radius-pill);font-family:var(--md-font);font-weight:600;font-size:.8rem;background:var(--md-primary);color:var(--md-on-primary);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap;box-shadow:var(--md-el1);min-height:40px;min-width:40px;position:relative;overflow:hidden;user-select:none;outline:0;-webkit-tap-highlight-color:transparent;transition:all var(--md-dur-m2) var(--md-ease-emphasized),box-shadow var(--md-dur-m4) var(--md-ease-standard),transform var(--md-dur-s4) var(--md-ease-emphasized)}
          .btn:active{transform:scale(.94)}
