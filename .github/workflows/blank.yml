          echo "✅ All project files generated successfully!"
          echo "📁 Project structure:"
          find "$BASE" -type f -not -path '*/.git/*' | sort

      # ──────────────────────────────────────────
      # 3. Setup JDK 17
      # ──────────────────────────────────────────
      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ──────────────────────────────────────────
      # 4. Setup Android SDK
      # ──────────────────────────────────────────
      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      # ──────────────────────────────────────────
      # 5. Build APK
      # ──────────────────────────────────────────
      - name: 🏗️ Build ${{ github.event.inputs.build_type || 'release' }} APK
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'release' }}"
          if [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      # ──────────────────────────────────────────
      # 6. Sign APK (if keystore secrets provided)
      # ──────────────────────────────────────────
      - name: 🔐 Sign Release APK
        if: ${{ (github.event.inputs.build_type || 'release') == 'release' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED="app/build/outputs/apk/release/app-release.apk"
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "🔐 Signing APK..."
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
              --ks release.keystore \
              --ks-pass pass:"$KEYSTORE_PASSWORD" \
              --key-pass pass:"${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" \
              --ks-key-alias "${KEY_ALIAS:-resync}" \
              --out "$SIGNED" "$UNSIGNED"
            $ANDROID_HOME/build-tools/34.0.0/apksigner verify "$SIGNED"
            echo "✅ Signed!"
          else
            echo "⚠️ No keystore secrets — copying unsigned APK"
            cp "$UNSIGNED" "$SIGNED"
          fi

      # ──────────────────────────────────────────
      # 7. Rename artifact
      # ──────────────────────────────────────────
      - name: 📝 Rename APK
        run: |
          BT="${{ github.event.inputs.build_type || 'release' }}"
          TS=$(date +%Y%m%d_%H%M%S)
          if [ "$BT" = "release" ]; then
            SRC="app/build/outputs/apk/release/app-release.apk"
          else
            SRC="app/build/outputs/apk/debug/app-debug.apk"
          fi
          NAME="ResyncScheduler_${BT}_${TS}.apk"
          cp "$SRC" "$NAME"
          echo "APK_ARTIFACT=$NAME" >> $GITHUB_ENV

      # ──────────────────────────────────────────
      # 8. Upload APK as artifact
      # ──────────────────────────────────────────
      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_ARTIFACT }}
          path: ${{ env.APK_ARTIFACT }}
          retention-days: 30

      # ──────────────────────────────────────────
      # 9. Create GitHub Release
      # ──────────────────────────────────────────
      - name: 🚀 Publish Release
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && (github.event.inputs.build_type || 'release') == 'release' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "📱 Release v${{ github.run_number }}"
          body: |
            ## 🎲 Resync Scheduler — APK Build
            
            | Info | Value |
            |------|-------|
            | **Build** | `release` |
            | **Build #** | ${{ github.run_number }} |
            
            دانلود کنید و روی گوشی اندروید نصب کنید.
            این برنامه کاملاً **آفلاین** کار می‌کند.
          files: ${{ env.APK_ARTIFACT }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ──────────────────────────────────────────
      # 10. Summary
      # ──────────────────────────────────────────
      - name: 📊 Summary
        run: |
          echo "============================================="
          echo "  ✅ Build Complete!"
          echo "  📱 APK: $APK_ARTIFACT"
          if [ -f "$APK_ARTIFACT" ]; then
            echo "  📦 Size: $(du -h $APK_ARTIFACT | cut -f1)"
          fi
          echo "============================================="
