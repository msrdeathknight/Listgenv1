          .btn-outline:hover{background:var(--md-surface-container-high);border-color:var(--md-primary)}
          .btn-sm{padding:6px 12px;font-size:.75rem;min-height:32px;min-width:32px}
          .list-item{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--md-surface);border-radius:var(--md-radius-md);margin-bottom:4px;border:1px solid transparent;animation:listItemEntrance var(--md-dur-m4) var(--md-ease-emphasized) both;transition:border-color var(--md-dur-s4) var(--md-ease-standard),background var(--md-dur-m4) var(--md-ease-standard),transform var(--md-dur-m2) var(--md-ease-emphasized),box-shadow var(--md-dur-m2) var(--md-ease-standard);transform-origin:top center}
          .list-item:hover{border-color:var(--md-outline-variant);background:var(--md-surface-container-high);transform:scale(1.005);box-shadow:var(--md-el1)}
          .list-item:active{transform:scale(.98)}
          @keyframes listItemEntrance{from{opacity:0;transform:translateY(-8px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
          .list-item .name{flex:1;font-weight:500;font-size:.85rem;min-width:0;word-break:break-word}
          .list-item .gender-badge{font-size:.6rem;font-weight:500;padding:1px 10px;border-radius:var(--md-radius-pill);cursor:pointer;border:1px solid transparent;user-select:none;white-space:nowrap;background:var(--md-surface-container-high);color:var(--md-on-surface-variant);transition:all .25s var(--md-ease-spring)}
          .list-item .gender-badge.female{background:var(--gender-female);color:#fff}
          .list-item .gender-badge.male{background:var(--gender-male);color:#fff}
          .list-item .gender-badge.none{background:var(--md-surface-container);border-color:var(--md-outline-variant)}
