name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🧹 Install Capacitor
        run: |
          npm install -g @capacitor/cli @capacitor/core
          npm install @capacitor/android

      - name: 🏗️ Create Capacitor project
        run: |
          npx cap init "لیست ساز" "com.resync.listsaz" --web-dir=./www
          npx cap add android

      - name: 📄 Copy index.html to Capacitor web directory
        run: |
          # بررسی وجود فایل اصلی
          if [ ! -f index.html ]; then
            echo "❌ index.html پیدا نشد!"
            exit 1
          fi
          # جایگزینی فایل پیش‌فرض با فایل پروژه
          cp index.html www/

      - name: ⚙️ Configure Capacitor (اختیاری)
        run: |
          cat > capacitor.config.json <<EOF
          {
            "appId": "com.resync.listsaz",
            "appName": "لیست ساز حرفه‌ای",
            "webDir": "www",
            "android": {
              "allowMixedContent": true,
              "captureInput": true
            }
          }
          EOF
          npx cap sync android

      - name: 🔨 Build APK (Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: 📦 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Listsaz-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
