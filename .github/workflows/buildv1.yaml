name: Build Resync Android APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name for the generated APK"
        required: false
        default: "1.0.0"
  push:
    paths:
      - ".github/workflows/build-resync.yml"

permissions:
  contents: write

jobs:
  create-and-build:
    name: Generate Resync and build APK
    runs-on: ubuntu-latest
    env:
      GRADLE_VERSION: "8.6"
      ANDROID_COMPILE_SDK: "35"
      ANDROID_BUILD_TOOLS: "35.0.0"
      VERSION_NAME: ${{ inputs.version_name || '1.0.0' }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          java-package: jdk
          architecture: x64

      - name: Verify Java version
        run: java -version

      - name: Install Android platform and accept licenses
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME}" -type f -name sdkmanager | head -n 1)"
          test -n "${SDKMANAGER}"
          yes | "${SDKMANAGER}" --licenses >/dev/null || true
          "${SDKMANAGER}" "platform-tools" "platforms;android-${ANDROID_COMPILE_SDK}" "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Create the complete Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/resync/app app/src/main/res/values app/src/main/res/xml .github

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Resync"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.resync.app"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.resync.app"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = System.getenv("VERSION_NAME") ?: "1.0.0"
              }
              buildTypes {
                  release {
                      isMinifyEnabled = false
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true; buildConfig = true }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.12.01")
              implementation(composeBom)
              androidTestImplementation(composeBom)
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.activity:activity-compose:1.10.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.navigation:navigation-compose:2.8.0")
              debugImplementation("androidx.compose.ui:ui-tooling")
              debugImplementation("androidx.compose.ui:ui-test-manifest")
          }
          EOF

          : > app/proguard-rules.pro

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources><string name="app_name">Resync</string></resources>
          EOF

          cat > app/src/main/res/values/themes.xml <<'EOF'
          <resources>
            <style name="Theme.Resync" parent="android:style/Theme.Material.Light.NoActionBar">
              <item name="android:fontFamily">sans</item>
              <item name="android:windowLightStatusBar">true</item>
            </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:allowBackup="true" android:label="Resync" android:theme="@style/Theme.Resync" android:supportsRtl="true">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/resync/app/MainActivity.kt <<'EOF'
          package com.resync.app

          import android.content.Context
          import android.content.Intent
          import android.os.Build
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.animation.*
          import androidx.compose.animation.core.*
          import androidx.compose.foundation.isSystemInDarkTheme
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.lazy.rememberLazyListState
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.automirrored.filled.Send
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.material3.dynamicDarkColorScheme
          import androidx.compose.material3.dynamicLightColorScheme
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.composed
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.draw.scale
          import androidx.compose.ui.focus.onFocusEvent
          import androidx.compose.ui.platform.LocalClipboardManager
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.platform.LocalLayoutDirection
          import androidx.compose.ui.platform.LocalSoftwareKeyboardController
          import androidx.compose.ui.text.AnnotatedString
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.LayoutDirection
          import androidx.compose.ui.unit.dp
          import androidx.navigation.compose.NavHost
          import androidx.navigation.compose.composable
          import androidx.navigation.compose.rememberNavController
          import java.time.LocalDate
          import kotlin.random.Random
          import kotlinx.coroutines.launch

          // ---------- Data ----------
          data class Person(val name: String, val gender: String = "خانم")
          data class ScheduleRow(val person: Person, val date: LocalDate)

          // ---------- Enhanced Animation Extensions ----------
          private fun Modifier.expandOnFocus() = composed {
              var isFocused by remember { mutableStateOf(false) }
              val scale by animateFloatAsState(
                  targetValue = if (isFocused) 1.02f else 1f,
                  animationSpec = spring(dampingRatio = 0.6f, stiffness = 200f),
                  label = "focus_scale"
              )
              this
                  .scale(scale)
                  .onFocusEvent { isFocused = it.isFocused }
          }

          // ---------- Utilities ----------
          fun loadPeople(prefs: android.content.SharedPreferences): List<Person> =
              prefs.getString("people", "")!!.split("\\u001e").filter { it.isNotBlank() }.map {
                  val x = it.split("\\u001f")
                  Person(x[0], x.getOrElse(1) { "خانم" })
              }

          fun ordinal(n: Int): String {
              return when (n) {
                  1 -> "اول"
                  2 -> "دوم"
                  3 -> "سوم"
                  4 -> "چهارم"
                  5 -> "پنجم"
                  6 -> "ششم"
                  7 -> "هفتم"
                  8 -> "هشتم"
                  9 -> "نهم"
                  10 -> "دهم"
                  11 -> "یازدهم"
                  12 -> "دوازدهم"
                  13 -> "سیزدهم"
                  14 -> "چهاردهم"
                  15 -> "پانزدهم"
                  16 -> "شانزدهم"
                  17 -> "هفدهم"
                  18 -> "هجدهم"
                  19 -> "نوزدهم"
                  20 -> "بیستم"
                  in 21..29 -> "بیست و ${ordinal(n - 20)}"
                  30 -> "سی‌ام"
                  in 31..39 -> "سی و ${ordinal(n - 30)}"
                  40 -> "چهلم"
                  in 41..49 -> "چهل و ${ordinal(n - 40)}"
                  50 -> "پنجاهم"
                  in 51..59 -> "پنجاه و ${ordinal(n - 50)}"
                  60 -> "شصتم"
                  in 61..69 -> "شصت و ${ordinal(n - 60)}"
                  70 -> "هفتادم"
                  in 71..79 -> "هفتاد و ${ordinal(n - 70)}"
                  80 -> "هشتادم"
                  in 81..89 -> "هشتاد و ${ordinal(n - 80)}"
                  90 -> "نودم"
                  in 91..99 -> "نود و ${ordinal(n - 90)}"
                  100 -> "صدم"
                  else -> "$n"
              }
          }

          fun formatOutput(rows: List<ScheduleRow>, emoji: String, template: String): String =
              rows.mapIndexed { i, r ->
                  val g = if (r.person.gender == "بدون جنسیت") "" else "${r.person.gender} "
                  when (template) {
                      "مینیمال" -> "$emoji ${i+1}. ${r.person.name} — ${jalali(r.date)}"
                      "تلگرام" -> "$emoji *نفر ${ordinal(i+1)}* ${g}${r.person.name}\n📅 ${weekday(r.date)} ${jalali(r.date)}"
                      else -> "$emoji نفر ${ordinal(i+1)} ${g}${r.person.name} — ${weekday(r.date)} ${jalali(r.date)}"
                  }
              }.joinToString("\n\n")

          fun weekday(d: LocalDate) = arrayOf("دوشنبه", "سه‌شنبه", "چهارشنبه", "پنج‌شنبه", "جمعه", "شنبه", "یکشنبه")[d.dayOfWeek.value - 1]

          fun jalali(d: LocalDate): String {
              var gy = d.year - 1600
              var gm = d.monthValue - 1
              var gd = d.dayOfMonth - 1
              val gdm = intArrayOf(31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31)
              var days = 365 * gy + (gy + 3) / 4 - (gy + 99) / 100 + (gy + 399) / 400
              for (i in 0 until gm) days += gdm[i]
              if (gm > 1 && ((gy % 4 == 0 && gy % 100 != 0) || gy % 400 == 0)) days++
              days += gd
              var j = days - 79
              val jp = j / 12053
              j %= 12053
              var jy = 979 + 33 * jp + 4 * (j / 1461)
              j %= 1461
              if (j >= 366) { jy += (j - 1) / 365; j = (j - 1) % 365 }
              val jm = if (j < 186) j / 31 + 1 else (j - 186) / 30 + 7
              val jd = if (j < 186) j % 31 + 1 else (j - 186) % 30 + 1
              return "%04d/%02d/%02d".format(jy, jm, jd)
          }

          // ---------- Main Activity ----------
          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      CompositionLocalProvider(LocalLayoutDirection provides LayoutDirection.Rtl) {
                          ResyncApp()
                      }
                  }
              }
          }

          @OptIn(ExperimentalMaterial3Api::class, ExperimentalAnimationApi::class)
          @Composable
          fun ResyncApp() {
              val context = LocalContext.current
              val prefs = remember { context.getSharedPreferences("resync", Context.MODE_PRIVATE) }
              val scope = rememberCoroutineScope()

              var people by remember { mutableStateOf(loadPeople(prefs)) }
              var name by remember { mutableStateOf("") }
              var newGender by remember { mutableStateOf("خانم") }
              var darkOverride by remember { mutableStateOf<Boolean?>(null) }
              var query by remember { mutableStateOf("") }
              var searchOpen by remember { mutableStateOf(false) }
              var emoji by remember { mutableStateOf(prefs.getString("emoji", "💎") ?: "💎") }
              var startDate by remember { mutableStateOf(LocalDate.parse(prefs.getString("date", LocalDate.now().toString()))) }
              var previousSeed by remember { mutableLongStateOf(prefs.getLong("seed", 0L)) }
              var template by remember { mutableStateOf(prefs.getString("template", "رسمی") ?: "رسمی") }
              var rows by remember { mutableStateOf(emptyList<ScheduleRow>()) }
              var showDatePicker by remember { mutableStateOf(false) }
              var bulkDialog by remember { mutableStateOf(false) }
              var editTarget by remember { mutableStateOf<Person?>(null) }
              var deleteTarget by remember { mutableStateOf<Person?>(null) }
              val snackbarHostState = remember { SnackbarHostState() }
              val clipboard = LocalClipboardManager.current
              val keyboardController = LocalSoftwareKeyboardController.current

              fun persist() {
                  prefs.edit()
                      .putString("people", people.joinToString("\\u001e") { "${it.name}\\u001f${it.gender}" })
                      .putString("emoji", emoji)
                      .putString("date", startDate.toString())
                      .putString("template", template)
                      .putLong("seed", previousSeed)
                      .apply()
              }

              fun generate(reuse: Boolean) {
                  if (people.isEmpty()) return
                  val seed = if (reuse && previousSeed != 0L) previousSeed else System.currentTimeMillis()
                  previousSeed = seed
                  rows = people.shuffled(Random(seed)).mapIndexed { index, person ->
                      ScheduleRow(person, startDate.plusDays(index.toLong()))
                  }
                  persist()
              }

              val dark = darkOverride ?: isSystemInDarkTheme()
              val colors = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                  if (dark) dynamicDarkColorScheme(context) else dynamicLightColorScheme(context)
              } else if (dark) darkColorScheme() else lightColorScheme()

              MaterialTheme(
                  colorScheme = colors,
                  shapes = Shapes(
                      extraSmall = RoundedCornerShape(8.dp),
                      small = RoundedCornerShape(12.dp),
                      medium = RoundedCornerShape(16.dp),
                      large = RoundedCornerShape(24.dp),
                      extraLarge = RoundedCornerShape(28.dp)
                  )
              ) {
                  val navController = rememberNavController()

                  Scaffold(
                      topBar = {
                          TopAppBar(
                              title = {
                                  AnimatedContent(
                                      targetState = people.size,
                                      transitionSpec = {
                                          fadeIn(tween(300)) + scaleIn(initialScale = 0.8f) with
                                          fadeOut(tween(200)) + scaleOut(targetScale = 0.8f)
                                      },
                                      label = "title"
                                  ) { count ->
                                      Column {
                                          Text("Resync", fontWeight = FontWeight.Bold)
                                          Text(
                                              "$count نفر در فهرست",
                                              style = MaterialTheme.typography.labelMedium,
                                              color = MaterialTheme.colorScheme.onSurfaceVariant
                                          )
                                      }
                                  }
                              },
                              actions = {
                                  IconButton(
                                      onClick = {
                                          searchOpen = !searchOpen
                                          if (!searchOpen) query = ""
                                      },
                                      modifier = Modifier.scale(
                                          if (searchOpen) 0.8f else 1f
                                      )
                                  ) {
                                      Icon(
                                          if (searchOpen) Icons.Default.Close else Icons.Default.Search,
                                          contentDescription = "جست‌وجو"
                                      )
                                  }
                                  IconButton(
                                      onClick = { darkOverride = !dark },
                                      modifier = Modifier.scale(
                                          animateFloatAsState(
                                              targetValue = if (dark) 0.9f else 1f,
                                              animationSpec = spring(dampingRatio = 0.5f)
                                          ).value
                                      )
                                  ) {
                                      Icon(
                                          if (dark) Icons.Default.LightMode else Icons.Default.DarkMode,
                                          "تغییر حالت"
                                      )
                                  }
                              }
                          )
                      },
                      snackbarHost = { SnackbarHost(snackbarHostState) }
                  ) { padding ->
                      NavHost(
                          navController = navController,
                          startDestination = "people",
                          modifier = Modifier.padding(padding),
                          enterTransition = {
                              slideInHorizontally(
                                  initialOffsetX = { it },
                                  animationSpec = tween(400, easing = FastOutSlowInEasing)
                              ) + fadeIn(animationSpec = tween(400))
                          },
                          exitTransition = {
                              slideOutHorizontally(
                                  targetOffsetX = { -it },
                                  animationSpec = tween(300, easing = FastOutLinearInEasing)
                              ) + fadeOut(animationSpec = tween(300))
                          },
                          popEnterTransition = {
                              slideInHorizontally(
                                  initialOffsetX = { -it },
                                  animationSpec = tween(400, easing = FastOutSlowInEasing)
                              ) + fadeIn(animationSpec = tween(400))
                          },
                          popExitTransition = {
                              slideOutHorizontally(
                                  targetOffsetX = { it },
                                  animationSpec = tween(300, easing = FastOutLinearInEasing)
                              ) + fadeOut(animationSpec = tween(300))
                          }
                      ) {
                          composable("people") {
                              PeopleScreen(
                                  people = people,
                                  name = name,
                                  newGender = newGender,
                                  query = query,
                                  searchOpen = searchOpen,
                                  onNameChange = { name = it },
                                  onGenderChange = { newGender = it },
                                  onAddPerson = {
                                      val n = name.trim()
                                      if (n.isNotEmpty() && people.none { it.name == n }) {
                                          people = people + Person(n, newGender)
                                          name = ""
                                          persist()
                                          keyboardController?.hide()
                                      }
                                  },
                                  onBulkAdd = { bulkDialog = true },
                                  onEdit = { editTarget = it },
                                  onDelete = { deleteTarget = it },
                                  onQueryChange = { query = it },
                                  onSearchToggle = { searchOpen = !searchOpen },
                                  onNext = {
                                      keyboardController?.hide()
                                      navController.navigate("settings")
                                  }
                              )
                          }
                          composable("settings") {
                              SettingsOutputScreen(
                                  people = people,
                                  rows = rows,
                                  emoji = emoji,
                                  startDate = startDate,
                                  template = template,
                                  previousSeed = previousSeed,
                                  onEmojiChange = { emoji = it; persist() },
                                  onDateChange = { date -> startDate = date; persist() },
                                  onTemplateChange = { template = it; persist() },
                                  onGenerate = { generate(false) },
                                  onReuseSeed = { generate(true) },
                                  onShowDatePicker = { showDatePicker = true },
                                  onBack = { navController.popBackStack() },
                                  clipboard = clipboard,
                                  context = context
                              )
                          }
                      }
                  }

                  // ---------- Dialogs ----------
                  if (bulkDialog) {
                      BulkDialog(
                          onDismiss = { bulkDialog = false },
                          onAdd = { text ->
                              val existing = people.map { it.name }.toSet()
                              val newPeople = text.split(Regex("[,\\n]")).map { it.trim() }
                                  .filter { it.isNotEmpty() && it !in existing }
                                  .distinct()
                                  .map { Person(it) }
                              if (newPeople.isNotEmpty()) {
                                  people = people + newPeople
                                  persist()
                              }
                              bulkDialog = false
                          }
                      )
                  }
                  if (editTarget != null) {
                      EditDialog(
                          person = editTarget!!,
                          onDismiss = { editTarget = null },
                          onSave = { updated ->
                              people = people.map { if (it == editTarget) updated else it }
                              persist()
                              editTarget = null
                          }
                      )
                  }
                  if (deleteTarget != null) {
                      AlertDialog(
                          onDismissRequest = { deleteTarget = null },
                          title = { Text("حذف شخص") },
                          text = { Text("${deleteTarget!!.name} حذف شود؟") },
                          confirmButton = {
                              TextButton(
                                  onClick = {
                                      val removed = deleteTarget!!
                                      people = people.filter { it != removed }
                                      persist()
                                      deleteTarget = null
                                  }
                              ) { Text("حذف") }
                          },
                          dismissButton = {
                              TextButton(onClick = { deleteTarget = null }) { Text("انصراف") }
                          }
                      )
                  }
                  if (showDatePicker) {
                      val state = rememberDatePickerState(
                          initialSelectedDateMillis = startDate.toEpochDay() * 86400000
                      )
                      DatePickerDialog(
                          onDismissRequest = { showDatePicker = false },
                          confirmButton = {
                              TextButton(
                                  onClick = {
                                      state.selectedDateMillis?.let {
                                          startDate = LocalDate.ofEpochDay(it / 86400000)
                                          persist()
                                      }
                                      showDatePicker = false
                                  }
                              ) { Text("تأیید") }
                          },
                          dismissButton = {
                              TextButton(onClick = { showDatePicker = false }) { Text("انصراف") }
                          }
                      ) {
                          DatePicker(state = state)
                      }
                  }
              }
          }

          // ---------- People Screen ----------
          @Composable
          fun PeopleScreen(
              people: List<Person>,
              name: String,
              newGender: String,
              query: String,
              searchOpen: Boolean,
              onNameChange: (String) -> Unit,
              onGenderChange: (String) -> Unit,
              onAddPerson: () -> Unit,
              onBulkAdd: () -> Unit,
              onEdit: (Person) -> Unit,
              onDelete: (Person) -> Unit,
              onQueryChange: (String) -> Unit,
              onSearchToggle: () -> Unit,
              onNext: () -> Unit
          ) {
              val filtered = people.filter { it.name.contains(query.trim(), true) }
              val listState = rememberLazyListState()
              val keyboardController = LocalSoftwareKeyboardController.current

              Box(modifier = Modifier.fillMaxSize()) {
                  LazyColumn(
                      state = listState,
                      modifier = Modifier
                          .fillMaxSize()
                          .padding(bottom = 120.dp)
                          .padding(horizontal = 16.dp),
                      verticalArrangement = Arrangement.spacedBy(12.dp)
                  ) {
                      // Search bar with enhanced animation
                      item {
                          AnimatedVisibility(
                              visible = searchOpen,
                              enter = expandVertically(
                                  animationSpec = spring(
                                      dampingRatio = 0.7f,
                                      stiffness = 400f
                                  )
                              ) + fadeIn(animationSpec = tween(300)),
                              exit = shrinkVertically(
                                  animationSpec = spring(
                                      dampingRatio = 0.7f,
                                      stiffness = 400f
                                  )
                              ) + fadeOut(animationSpec = tween(200))
                          ) {
                              OutlinedTextField(
                                  value = query,
                                  onValueChange = onQueryChange,
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .animateContentSize(
                                          animationSpec = spring(
                                              dampingRatio = 0.6f,
                                              stiffness = 300f
                                          )
                                      )
                                      .expandOnFocus(),
                                  singleLine = true,
                                  label = { Text("جست‌وجو در افراد") },
                                  leadingIcon = { Icon(Icons.Default.Search, null) },
                                  trailingIcon = {
                                      if (query.isNotEmpty()) {
                                          IconButton(
                                              onClick = { onQueryChange("") },
                                              modifier = Modifier.scale(
                                                  animateFloatAsState(
                                                      targetValue = if (query.isNotEmpty()) 1f else 0f,
                                                      animationSpec = spring()
                                                  ).value
                                              )
                                          ) {
                                              Icon(Icons.Default.Clear, "پاک کردن")
                                          }
                                      }
                                  },
                                  shape = RoundedCornerShape(24.dp),
                                  colors = OutlinedTextFieldDefaults.colors(
                                      focusedBorderColor = MaterialTheme.colorScheme.primary,
                                      unfocusedBorderColor = MaterialTheme.colorScheme.outline
                                  )
                              )
                          }
                      }

                      // People list card
                      item {
                          Card(
                              modifier = Modifier.animateContentSize(
                                  animationSpec = spring(
                                      dampingRatio = 0.7f,
                                      stiffness = 300f
                                  )
                              ),
                              colors = CardDefaults.cardColors(
                                  containerColor = MaterialTheme.colorScheme.surfaceVariant
                              )
                          ) {
                              Column(Modifier.padding(16.dp)) {
                                  Row(
                                      modifier = Modifier.fillMaxWidth(),
                                      horizontalArrangement = Arrangement.SpaceBetween,
                                      verticalAlignment = Alignment.CenterVertically
                                  ) {
                                      AnimatedContent(
                                          targetState = people.size,
                                          transitionSpec = {
                                              fadeIn(tween(300)) + scaleIn(initialScale = 0.7f) with
                                              fadeOut(tween(200)) + scaleOut(targetScale = 0.7f)
                                          },
                                          label = "count"
                                      ) { count ->
                                          Text(
                                              "افراد ($count)",
                                              style = MaterialTheme.typography.titleLarge,
                                              fontWeight = FontWeight.SemiBold
                                          )
                                      }
                                      if (people.isNotEmpty()) {
                                          AssistChip(
                                              onClick = onNext,
                                              label = { Text("مرحله بعد") },
                                              leadingIcon = {
                                                  Icon(
                                                      Icons.Default.ArrowForward,
                                                      null,
                                                      Modifier.scale(
                                                          animateFloatAsState(
                                                              targetValue = 1f,
                                                              animationSpec = infiniteRepeatable(
                                                                  animation = tween(600, easing = LinearEasing),
                                                                  repeatMode = RepeatMode.Reverse
                                                              )
                                                          ).value
                                                      )
                                                  )
                                              },
                                              colors = AssistChipDefaults.assistChipColors(
                                                  containerColor = MaterialTheme.colorScheme.primary,
                                                  labelColor = MaterialTheme.colorScheme.onPrimary
                                              ),
                                              modifier = Modifier.animateContentSize()
                                          )
                                      }
                                  }
                                  Spacer(Modifier.height(8.dp))
                                  if (filtered.isEmpty()) {
                                      Box(
                                          Modifier
                                              .fillMaxWidth()
                                              .padding(vertical = 24.dp)
                                              .animateContentSize(),
                                          contentAlignment = Alignment.Center
                                      ) {
                                          Column(horizontalAlignment = Alignment.CenterHorizontally) {
                                              Icon(
                                                  Icons.Default.People,
                                                  null,
                                                  Modifier.size(48.dp),
                                                  tint = MaterialTheme.colorScheme.primary
                                              )
                                              Spacer(Modifier.height(8.dp))
                                              Text(
                                                  if (people.isEmpty()) "هنوز هیچ فردی اضافه نشده است"
                                                  else "نتیجه‌ای پیدا نشد."
                                              )
                                              if (people.isEmpty()) {
                                                  Text(
                                                      "اولین نفر را از نوار پایین اضافه کنید.",
                                                      style = MaterialTheme.typography.bodySmall
                                                  )
                                              }
                                          }
                                      }
                                  } else {
                                      Column(
                                          Modifier
                                              .fillMaxWidth()
                                              .heightIn(max = 320.dp)
                                              .verticalScroll(rememberScrollState())
                                              .animateContentSize(
                                                  animationSpec = spring(
                                                      dampingRatio = 0.6f,
                                                      stiffness = 250f
                                                  )
                                              )
                                      ) {
                                          filtered.forEach { p ->
                                              PersonItem(
                                                  person = p,
                                                  onEdit = { onEdit(p) },
                                                  onDelete = { onDelete(p) }
                                              )
                                          }
                                      }
                                  }
                              }
                          }
                      }

                      // Empty space at bottom
                      item { Spacer(Modifier.height(16.dp)) }
                  }

                  // ---------- Bottom Input Bar (Enhanced) ----------
                  Surface(
                      modifier = Modifier
                          .align(Alignment.BottomCenter)
                          .fillMaxWidth()
                          .imePadding(),
                      shadowElevation = 12.dp,
                      tonalElevation = 8.dp,
                      color = MaterialTheme.colorScheme.surfaceContainerHigh,
                      shape = RoundedCornerShape(
                          topStart = 24.dp,
                          topEnd = 24.dp,
                          bottomStart = 0.dp,
                          bottomEnd = 0.dp
                      )
                  ) {
                      AnimatedContent(
                          targetState = keyboardController?.isVisible ?: false,
                          transitionSpec = {
                              fadeIn(tween(300)) + slideInVertically(
                                  initialOffsetY = { it },
                                  animationSpec = tween(300, easing = FastOutSlowInEasing)
                              ) with
                              fadeOut(tween(200)) + slideOutVertically(
                                  targetOffsetY = { it },
                                  animationSpec = tween(200, easing = FastOutLinearInEasing)
                              )
                          },
                          label = "input_bar"
                      ) { isKeyboardVisible ->
                          Row(
                              Modifier
                                  .fillMaxWidth()
                                  .padding(horizontal = 12.dp)
                                  .padding(vertical = if (isKeyboardVisible) 12.dp else 8.dp)
                                  .animateContentSize(
                                      animationSpec = spring(
                                          dampingRatio = 0.6f,
                                          stiffness = 350f
                                      )
                                  ),
                              verticalAlignment = Alignment.CenterVertically,
                              horizontalArrangement = Arrangement.spacedBy(8.dp)
                          ) {
                              OutlinedTextField(
                                  value = name,
                                  onValueChange = onNameChange,
                                  modifier = Modifier
                                      .weight(1f)
                                      .expandOnFocus(),
                                  singleLine = true,
                                  label = { Text("نام شخص") },
                                  shape = RoundedCornerShape(32.dp),
                                  colors = OutlinedTextFieldDefaults.colors(
                                      focusedBorderColor = MaterialTheme.colorScheme.primary,
                                      unfocusedBorderColor = MaterialTheme.colorScheme.outline,
                                      focusedContainerColor = MaterialTheme.colorScheme.surfaceContainerLow,
                                      unfocusedContainerColor = MaterialTheme.colorScheme.surfaceContainerLowest
                                  ),
                                  textStyle = MaterialTheme.typography.bodyLarge.copy(
                                      fontWeight = FontWeight.Medium
                                  )
                              )
                              FilterChip(
                                  selected = true,
                                  onClick = {
                                      val next = when (newGender) {
                                          "خانم" -> "آقا"
                                          "آقا" -> "بدون جنسیت"
                                          else -> "خانم"
                                      }
                                      onGenderChange(next)
                                  },
                                  label = { Text(newGender) },
                                  leadingIcon = {
                                      Icon(
                                          Icons.Default.Person,
                                          null,
                                          Modifier.size(18.dp)
                                      )
                                  },
                                  colors = FilterChipDefaults.filterChipColors(
                                      containerColor = MaterialTheme.colorScheme.secondaryContainer,
                                      selectedContainerColor = MaterialTheme.colorScheme.secondaryContainer
                                  ),
                                  modifier = Modifier.animateContentSize()
                              )
                              FilledIconButton(
                                  onClick = onAddPerson,
                                  modifier = Modifier
                                      .size(56.dp)
                                      .scale(
                                          animateFloatAsState(
                                              targetValue = if (name.isNotBlank()) 1f else 0.9f,
                                              animationSpec = spring(dampingRatio = 0.5f)
                                          ).value
                                      ),
                                  colors = IconButtonDefaults.filledIconButtonColors(
                                      containerColor = if (name.isNotBlank())
                                          MaterialTheme.colorScheme.primary
                                      else
                                          MaterialTheme.colorScheme.primary.copy(alpha = 0.5f)
                                  )
                              ) {
                                  Icon(
                                      Icons.Default.Add,
                                      "افزودن",
                                      tint = MaterialTheme.colorScheme.onPrimary,
                                      modifier = Modifier.scale(
                                          animateFloatAsState(
                                              targetValue = if (name.isNotBlank()) 1f else 0.8f,
                                              animationSpec = spring(dampingRatio = 0.5f)
                                          ).value
                                      )
                                  )
                              }
                              IconButton(
                                  onClick = onBulkAdd,
                                  modifier = Modifier.size(56.dp)
                              ) {
                                  Icon(Icons.Default.GroupAdd, "افزودن گروهی")
                              }
                          }
                      }
                  }
              }
          }

          // ---------- Person Item with Enhanced Animations ----------
          @Composable
          fun PersonItem(
              person: Person,
              onEdit: () -> Unit,
              onDelete: () -> Unit
          ) {
              var expanded by remember { mutableStateOf(false) }
              val coroutineScope = rememberCoroutineScope()

              AnimatedItem(
                  enter = fadeIn(
                      animationSpec = spring(dampingRatio = 0.7f, stiffness = 300f)
                  ) + scaleIn(
                      initialScale = 0.7f,
                      animationSpec = spring(dampingRatio = 0.6f, stiffness = 250f)
                  ),
                  exit = fadeOut(
                      animationSpec = spring(dampingRatio = 0.7f, stiffness = 400f)
                  ) + scaleOut(
                      targetScale = 0.7f,
                      animationSpec = spring(dampingRatio = 0.7f, stiffness = 400f)
                  )
              ) {
                  ElevatedCard(
                      modifier = Modifier
                          .fillMaxWidth()
                          .padding(vertical = 4.dp)
                          .animateContentSize(
                              animationSpec = spring(
                                  dampingRatio = 0.6f,
                                  stiffness = 300f
                              )
                          )
                          .scale(
                              animateFloatAsState(
                                  targetValue = if (expanded) 1.02f else 1f,
                                  animationSpec = spring(dampingRatio = 0.4f, stiffness = 200f)
                              ).value
                          ),
                      shape = RoundedCornerShape(20.dp),
                      colors = CardDefaults.cardColors(
                          containerColor = if (expanded)
                              MaterialTheme.colorScheme.primaryContainer
                          else
                              MaterialTheme.colorScheme.surface
                      ),
                      elevation = if (expanded) CardDefaults.elevatedCardElevation(
                          defaultElevation = 8.dp
                      ) else CardDefaults.elevatedCardElevation()
                  ) {
                      Row(
                          Modifier
                              .fillMaxWidth()
                              .clickable(
                                  interactionSource = remember { MutableInteractionSource() },
                                  indication = rememberRipple(
                                      bounded = true,
                                      radius = 40.dp,
                                      color = MaterialTheme.colorScheme.primary.copy(alpha = 0.2f)
                                  )
                              ) {
                                  expanded = !expanded
                              }
                              .padding(horizontal = 12.dp, vertical = 10.dp),
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          // Avatar
                          AnimatedContent(
                              targetState = person.name.take(1),
                              transitionSpec = {
                                  fadeIn(tween(300)) + scaleIn(initialScale = 0.5f) with
                                  fadeOut(tween(200)) + scaleOut(targetScale = 0.5f)
                              },
                              label = "avatar"
                          ) { initial ->
                              Surface(
                                  color = if (expanded)
                                      MaterialTheme.colorScheme.primary
                                  else
                                      MaterialTheme.colorScheme.primaryContainer,
                                  shape = RoundedCornerShape(16.dp),
                                  modifier = Modifier.size(46.dp),
                                  shadowElevation = if (expanded) 4.dp else 0.dp
                              ) {
                                  Box(contentAlignment = Alignment.Center) {
                                      Text(
                                          initial,
                                          style = MaterialTheme.typography.titleLarge,
                                          fontWeight = FontWeight.Bold,
                                          color = if (expanded)
                                              MaterialTheme.colorScheme.onPrimary
                                          else
                                              MaterialTheme.colorScheme.onPrimaryContainer
                                      )
                                  }
                              }
                          }

                          Spacer(Modifier.width(12.dp))

                          // Name and gender
                          Column(Modifier.weight(1f)) {
                              AnimatedContent(
                                  targetState = person.name,
                                  transitionSpec = {
                                      fadeIn(tween(300)) + slideInVertically(
                                          initialOffsetY = { -it / 4 },
                                          animationSpec = tween(300, easing = FastOutSlowInEasing)
                                      ) with
                                      fadeOut(tween(200)) + slideOutVertically(
                                          targetOffsetY = { it / 4 },
                                          animationSpec = tween(200, easing = FastOutLinearInEasing)
                                      )
                                  },
                                  label = "name"
                              ) { name ->
                                  Text(
                                      name,
                                      fontWeight = FontWeight.SemiBold,
                                      style = MaterialTheme.typography.bodyLarge
                                  )
                              }
                              AssistChip(
                                  onClick = {},
                                  label = { Text(person.gender) },
                                  leadingIcon = {
                                      Icon(
                                          Icons.Default.Person,
                                          null,
                                          Modifier.size(16.dp)
                                      )
                                  },
                                  colors = AssistChipDefaults.assistChipColors(
                                      containerColor = if (expanded)
                                          MaterialTheme.colorScheme.primaryContainer
                                      else
                                          MaterialTheme.colorScheme.surfaceVariant
                                  ),
                                  modifier = Modifier.animateContentSize()
                              )
                          }

                          // Actions
                          AnimatedVisibility(
                              visible = expanded || true,
                              enter = expandHorizontally(
                                  animationSpec = spring(dampingRatio = 0.7f, stiffness = 300f)
                              ) + fadeIn(),
                              exit = shrinkHorizontally(
                                  animationSpec = spring(dampingRatio = 0.7f, stiffness = 300f)
                              ) + fadeOut()
                          ) {
                              Row {
                                  IconButton(
                                      onClick = onEdit,
                                      modifier = Modifier.size(44.dp)
                                  ) {
                                      Icon(
                                          Icons.Default.Edit,
                                          "ویرایش ${person.name}",
                                          modifier = Modifier.scale(
                                              animateFloatAsState(
                                                  targetValue = 1f,
                                                  animationSpec = spring(dampingRatio = 0.5f)
                                              ).value
                                          )
                                      )
                                  }
                                  IconButton(
                                      onClick = onDelete,
                                      modifier = Modifier.size(44.dp)
                                  ) {
                                      Icon(
                                          Icons.Default.Delete,
                                          "حذف ${person.name}",
                                          tint = MaterialTheme.colorScheme.error,
                                          modifier = Modifier.scale(
                                              animateFloatAsState(
                                                  targetValue = 1f,
                                                  animationSpec = spring(dampingRatio = 0.5f)
                                              ).value
                                          )
                                      )
                                  }
                              }
                          }
                      }
                  }
              }
          }

          // ---------- Settings & Output Screen ----------
          @OptIn(ExperimentalAnimationApi::class)
          @Composable
          fun SettingsOutputScreen(
              people: List<Person>,
              rows: List<ScheduleRow>,
              emoji: String,
              startDate: LocalDate,
              template: String,
              previousSeed: Long,
              onEmojiChange: (String) -> Unit,
              onDateChange: (LocalDate) -> Unit,
              onTemplateChange: (String) -> Unit,
              onGenerate: () -> Unit,
              onReuseSeed: () -> Unit,
              onShowDatePicker: () -> Unit,
              onBack: () -> Unit,
              clipboard: androidx.compose.ui.platform.ClipboardManager,
              context: Context
          ) {
              val output = remember(rows, emoji, template) {
                  if (rows.isEmpty()) "" else formatOutput(rows, emoji, template)
              }
              val scope = rememberCoroutineScope()
              var buttonScale by remember { mutableStateOf(1f) }

              LazyColumn(
                  modifier = Modifier.fillMaxSize().padding(16.dp),
                  verticalArrangement = Arrangement.spacedBy(16.dp)
              ) {
                  // Settings card
                  item {
                      Card(
                          modifier = Modifier
                              .animateContentSize(
                                  animationSpec = spring(
                                      dampingRatio = 0.7f,
                                      stiffness = 250f
                                  )
                              )
                              .scale(
                                  animateFloatAsState(
                                      targetValue = 1f,
                                      animationSpec = spring(dampingRatio = 0.6f, stiffness = 200f)
                                  ).value
                              ),
                          colors = CardDefaults.cardColors(
                              containerColor = MaterialTheme.colorScheme.secondaryContainer
                          ),
                          shape = RoundedCornerShape(24.dp)
                      ) {
                          Column(
                              Modifier.padding(16.dp),
                              verticalArrangement = Arrangement.spacedBy(12.dp)
                          ) {
                              Row(
                                  modifier = Modifier.fillMaxWidth(),
                                  horizontalArrangement = Arrangement.SpaceBetween,
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  Text(
                                      "تنظیمات قرعه‌کشی",
                                      style = MaterialTheme.typography.titleLarge,
                                      fontWeight = FontWeight.SemiBold
                                  )
                                  IconButton(
                                      onClick = onBack,
                                      modifier = Modifier.scale(
                                          animateFloatAsState(
                                              targetValue = 1f,
                                              animationSpec = spring(dampingRatio = 0.5f)
                                          ).value
                                      )
                                  ) {
                                      Icon(Icons.Default.ArrowBack, "بازگشت")
                                  }
                              }

                              OutlinedTextField(
                                  value = emoji,
                                  onValueChange = onEmojiChange,
                                  label = { Text("ایموجی") },
                                  singleLine = true,
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .animateContentSize(),
                                  leadingIcon = { Text("🎨") },
                                  shape = RoundedCornerShape(20.dp)
                              )

                              OutlinedButton(
                                  onClick = onShowDatePicker,
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .scale(
                                          animateFloatAsState(
                                              targetValue = 1f,
                                              animationSpec = spring(dampingRatio = 0.5f)
                                          ).value
                                      )
                              ) {
                                  Icon(Icons.Default.DateRange, null)
                                  Spacer(Modifier.width(8.dp))
                                  AnimatedContent(
                                      targetState = startDate,
                                      transitionSpec = {
                                          fadeIn(tween(300)) + scaleIn(initialScale = 0.8f) with
                                          fadeOut(tween(200)) + scaleOut(targetScale = 0.8f)
                                      },
                                      label = "date"
                                  ) { date ->
                                      Text("تاریخ شروع: ${jalali(date)}")
                                  }
                              }

                              Text(
                                  "قالب خروجی",
                                  style = MaterialTheme.typography.labelLarge,
                                  color = MaterialTheme.colorScheme.onSurfaceVariant
                              )
                              Row(
                                  horizontalArrangement = Arrangement.spacedBy(8.dp),
                                  modifier = Modifier.animateContentSize()
                              ) {
                                  listOf("رسمی", "مینیمال", "تلگرام").forEachIndexed { index, t ->
                                      FilterChip(
                                          selected = template == t,
                                          onClick = {
                                              scope.launch {
                                                  buttonScale = 0.9f
                                                  onTemplateChange(t)
                                                  delay(100)
                                                  buttonScale = 1f
                                              }
                                          },
                                          label = { Text(t) },
                                          modifier = Modifier.scale(
                                              animateFloatAsState(
                                                  targetValue = if (template == t) 1.05f else 1f,
                                                  animationSpec = spring(dampingRatio = 0.5f)
                                              ).value
                                          )
                                      )
                                  }
                              }

                              Row(
                                  modifier = Modifier.fillMaxWidth(),
                                  horizontalArrangement = Arrangement.spacedBy(8.dp)
                              ) {
                                  Button(
                                      onClick = {
                                          scope.launch {
                                              buttonScale = 0.95f
                                              onGenerate()
                                              delay(200)
                                              buttonScale = 1f
                                          }
                                      },
                                      enabled = people.isNotEmpty(),
                                      modifier = Modifier
                                          .weight(1f)
                                          .scale(buttonScale)
                                  ) {
                                      Icon(Icons.Default.Refresh, null)
                                      Spacer(Modifier.width(6.dp))
                                      Text("ترتیب جدید")
                                  }
                                  OutlinedButton(
                                      onClick = {
                                          scope.launch {
                                              buttonScale = 0.95f
                                              onReuseSeed()
                                              delay(200)
                                              buttonScale = 1f
                                          }
                                      },
                                      enabled = people.isNotEmpty() && previousSeed != 0L,
                                      modifier = Modifier
                                          .weight(1f)
                                          .scale(buttonScale)
                                  ) {
                                      Text("Seed قبلی")
                                  }
                              }

                              if (people.isEmpty()) {
                                  AssistChip(
                                      onClick = { onBack() },
                                      label = { Text("ابتدا افراد را اضافه کنید") },
                                      leadingIcon = { Icon(Icons.Default.Warning, null) },
                                      colors = AssistChipDefaults.assistChipColors(
                                          containerColor = MaterialTheme.colorScheme.errorContainer,
                                          labelColor = MaterialTheme.colorScheme.onErrorContainer
                                      ),
                                      modifier = Modifier.animateContentSize()
                                  )
                              }
                          }
                      }
                  }

                  // Output preview with enhanced animation
                  item {
                      AnimatedContent(
                          targetState = rows,
                          transitionSpec = {
                              fadeIn(
                                  animationSpec = tween(400, easing = FastOutSlowInEasing)
                              ) + scaleIn(
                                  initialScale = 0.95f,
                                  animationSpec = tween(400, easing = FastOutSlowInEasing)
                              ) with
                              fadeOut(
                                  animationSpec = tween(300, easing = FastOutLinearInEasing)
                              ) + scaleOut(
                                  targetScale = 0.95f,
                                  animationSpec = tween(300, easing = FastOutLinearInEasing)
                              )
                          },
                          label = "output_preview"
                      ) { currentRows ->
                          if (currentRows.isEmpty()) {
                              Card(
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .animateContentSize(),
                                  colors = CardDefaults.cardColors(
                                      containerColor = MaterialTheme.colorScheme.surfaceVariant
                                  ),
                                  shape = RoundedCornerShape(24.dp)
                              ) {
                                  Column(
                                      Modifier.padding(32.dp),
                                      horizontalAlignment = Alignment.CenterHorizontally,
                                      verticalArrangement = Arrangement.Center
                                  ) {
                                      Icon(
                                          Icons.Default.ListAlt,
                                          null,
                                          Modifier.size(56.dp),
                                          tint = MaterialTheme.colorScheme.primary.copy(alpha = 0.6f)
                                      )
                                      Spacer(Modifier.height(12.dp))
                                      Text(
                                          "هنوز برنامه‌ای تولید نشده.",
                                          style = MaterialTheme.typography.titleMedium
                                      )
                                      Text(
                                          "روی «ترتیب جدید» بزنید.",
                                          style = MaterialTheme.typography.bodySmall,
                                          color = MaterialTheme.colorScheme.onSurfaceVariant
                                      )
                                  }
                              }
                          } else {
                              Card(
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .animateContentSize(
                                          animationSpec = spring(
                                              dampingRatio = 0.7f,
                                              stiffness = 250f
                                          )
                                      ),
                                  colors = CardDefaults.cardColors(
                                      containerColor = MaterialTheme.colorScheme.primaryContainer
                                  ),
                                  shape = RoundedCornerShape(24.dp)
                              ) {
                                  Column(Modifier.padding(16.dp)) {
                                      Row(
                                          modifier = Modifier.fillMaxWidth(),
                                          horizontalArrangement = Arrangement.SpaceBetween,
                                          verticalAlignment = Alignment.CenterVertically
                                      ) {
                                          Text(
                                              "پیش‌نمایش خروجی",
                                              style = MaterialTheme.typography.titleMedium,
                                              fontWeight = FontWeight.SemiBold
                                          )
                                          Badge(
                                              containerColor = MaterialTheme.colorScheme.primary,
                                              modifier = Modifier.scale(
                                                  animateFloatAsState(
                                                      targetValue = 1f,
                                                      animationSpec = infiniteRepeatable(
                                                          animation = tween(800, easing = LinearEasing),
                                                          repeatMode = RepeatMode.Reverse
                                                      )
                                                  ).value
                                              )
                                          ) {
                                              Text("${rows.size} نفر")
                                          }
                                      }
                                      Spacer(Modifier.height(8.dp))
                                      AnimatedContent(
                                          targetState = output,
                                          transitionSpec = {
                                              fadeIn(tween(300)) + slideInVertically(
                                                  initialOffsetY = { it / 4 },
                                                  animationSpec = tween(300, easing = FastOutSlowInEasing)
                                              ) with
                                              fadeOut(tween(200)) + slideOutVertically(
                                                  targetOffsetY = { -it / 4 },
                                                  animationSpec = tween(200, easing = FastOutLinearInEasing)
                                              )
                                          },
                                          label = "output_text"
                                      ) { text ->
                                          Text(
                                              text = text,
                                              style = MaterialTheme.typography.bodyLarge,
                                              modifier = Modifier
                                                  .fillMaxWidth()
                                                  .heightIn(max = 280.dp)
                                                  .verticalScroll(rememberScrollState())
                                                  .animateContentSize()
                                          )
                                      }
                                  }
                              }
                          }
                      }
                  }

                  // Action buttons with enhanced animations
                  item {
                      Row(
                          modifier = Modifier
                              .fillMaxWidth()
                              .animateContentSize(
                                  animationSpec = spring(
                                      dampingRatio = 0.7f,
                                      stiffness = 300f
                                  )
                              ),
                          horizontalArrangement = Arrangement.spacedBy(8.dp)
                      ) {
                          OutlinedButton(
                              onClick = onBack,
                              modifier = Modifier
                                  .weight(1f)
                                  .scale(
                                      animateFloatAsState(
                                          targetValue = 1f,
                                          animationSpec = spring(dampingRatio = 0.5f)
                                      ).value
                                  )
                          ) {
                              Icon(Icons.Default.ArrowBack, null)
                              Spacer(Modifier.width(4.dp))
                              Text("برگشت")
                          }
                          Button(
                              onClick = {
                                  clipboard.setText(AnnotatedString(output))
                              },
                              enabled = rows.isNotEmpty(),
                              modifier = Modifier
                                  .weight(1f)
                                  .scale(
                                      animateFloatAsState(
                                          targetValue = if (rows.isNotEmpty()) 1f else 0.95f,
                                          animationSpec = spring(dampingRatio = 0.5f)
                                      ).value
                                  )
                          ) {
                              Icon(Icons.Default.ContentCopy, null)
                              Spacer(Modifier.width(4.dp))
                              Text("کپی")
                          }
                          Button(
                              onClick = {
                                  context.startActivity(
                                      Intent.createChooser(
                                          Intent(Intent.ACTION_SEND).setType("text/plain")
                                              .putExtra(Intent.EXTRA_TEXT, output),
                                          "اشتراک‌گذاری"
                                      )
                                  )
                              },
                              enabled = rows.isNotEmpty(),
                              modifier = Modifier
                                  .weight(1f)
                                  .scale(
                                      animateFloatAsState(
                                          targetValue = if (rows.isNotEmpty()) 1f else 0.95f,
                                          animationSpec = spring(dampingRatio = 0.5f)
                                      ).value
                                  )
                          ) {
                              Icon(Icons.AutoMirrored.Filled.Send, null)
                              Spacer(Modifier.width(4.dp))
                              Text("اشتراک")
                          }
                      }
                  }
                  item { Spacer(Modifier.height(8.dp)) }
              }
          }

          // ---------- Dialogs ----------
          @Composable
          fun BulkDialog(onDismiss: () -> Unit, onAdd: (String) -> Unit) {
              var text by remember { mutableStateOf("") }
              AlertDialog(
                  onDismissRequest = onDismiss,
                  title = {
                      Text("افزودن گروهی")
                  },
                  text = {
                      OutlinedTextField(
                          value = text,
                          onValueChange = { text = it },
                          label = { Text("نام‌ها با کاما یا خط جدید") },
                          minLines = 4,
                          modifier = Modifier
                              .fillMaxWidth()
                              .expandOnFocus(),
                          shape = RoundedCornerShape(16.dp)
                      )
                  },
                  confirmButton = {
                      TextButton(onClick = { onAdd(text) }) {
                          Text("افزودن")
                      }
                  },
                  dismissButton = {
                      TextButton(onClick = onDismiss) {
                          Text("انصراف")
                      }
                  }
              )
          }

          @Composable
          fun EditDialog(person: Person, onDismiss: () -> Unit, onSave: (Person) -> Unit) {
              var n by remember { mutableStateOf(person.name) }
              var g by remember { mutableStateOf(person.gender) }
              AlertDialog(
                  onDismissRequest = onDismiss,
                  title = { Text("ویرایش شخص") },
                  text = {
                      Column {
                          OutlinedTextField(
                              value = n,
                              onValueChange = { n = it },
                              label = { Text("نام") },
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .expandOnFocus(),
                              shape = RoundedCornerShape(16.dp)
                          )
                          Spacer(Modifier.height(8.dp))
                          listOf("خانم", "آقا", "بدون جنسیت").forEach { gender ->
                              Row(verticalAlignment = Alignment.CenterVertically) {
                                  RadioButton(
                                      selected = g == gender,
                                      onClick = { g = gender }
                                  )
                                  Text(gender)
                              }
                          }
                      }
                  },
                  confirmButton = {
                      TextButton(
                          onClick = {
                              if (n.trim().isNotEmpty()) onSave(Person(n.trim(), g))
                          }
                      ) { Text("ذخیره") }
                  },
                  dismissButton = {
                      TextButton(onClick = onDismiss) { Text("انصراف") }
                  }
              )
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-cleanup: always

      - name: Build debug and release APKs
        run: |
          ./gradlew --no-daemon --console=plain --stacktrace :app:assembleDebug :app:assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Resync-APK-${{ inputs.version_name || '1.0.0' }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

      - name: Commit generated Android source
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "feat: enhance UI with MD3E animations and fix input bar"
          file_pattern: "settings.gradle.kts build.gradle.kts gradle.properties app gradlew gradlew.bat gradle"
